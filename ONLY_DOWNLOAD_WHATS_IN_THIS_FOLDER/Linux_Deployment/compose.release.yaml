services:
  detector:
    image: nine-ball-foul-detector-linux:1.0
    init: true
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    environment:
      DISPLAY: ${DISPLAY:-:0}
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      OUTPUT_DIR: /output
      CAMERA_SCAN_LIMIT: ${CAMERA_SCAN_LIMIT:-6}
      CAMERA_WIDTH: ${CAMERA_WIDTH:-1280}
      CAMERA_HEIGHT: ${CAMERA_HEIGHT:-720}
      CAMERA_FPS: ${CAMERA_FPS:-60}
    devices:
      - "${WEBCAM_DEVICE:-/dev/video0}:/dev/video0"
    group_add:
      - "${CAMERA_GID:-44}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./Output_Folder:/output
    shm_size: "1gb"
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
